<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>update</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="content">
        <H1>Write your tasks</H1>

        <section>
            <a href="{{ url_for('tasks') }}" class="boton">See your tasks</a>
        </section>

        <form action="{{ url_for('update', id=dato._id) }}" method="POST">
            <input type="text" value="{{ dato['_id'] }}" readonly>
            <br>
            <br>
            <label for="datetask">Date:</label>
            <input type="date" id="datetask" name="datetask" value="{{ dato['datetask'] }}" required>
            <br>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" value="{{ dato['name'] }}" required>
            <br>
            <label for="description">Description:</label>
            <input type="text" id="description" name="description" value="{{ dato['description'] }}" required>
            <br>
            <label for="name">Priority:</label>
            <select id="priority" name="priority" required>
                <option value="High" {% if dato['priority'] == 'High' %}selected{% endif %}>High</option>
                <option value="Medium" {% if dato['priority'] == 'Medium' %}selected{% endif %}>Medium</option>
                <option value="Low" {% if dato['priority'] == 'Low' %}selected{% endif %}>Low</option>
            </select>
            <br>
            <input class="btn-submit" type="submit" value="Update">
        </form>
    </div>
</body>
</html>
